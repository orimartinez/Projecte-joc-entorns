<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <title>Space Defender: Rogue Legacy</title>
    <style>
        body {
            margin: 0;
            background: #020205;
            color: white;
            text-align: center;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        canvas {
            border: 2px solid #445;
            background: radial-gradient(circle, #0a0a1a 0%, #020205 100%);
            display: block;
            margin: 10px auto;
        }

        #hud,
        #menu {
            margin-top: 10px;
            height: 80px;
        }

        /* Estils del Menú */
        #main-menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 10, 26, 0.95);
            padding: 30px;
            border: 2px solid #00f0ff;
            box-shadow: 0 0 20px #00f0ff;
            z-index: 10;
            min-width: 300px;
        }

        .btn {
            background: #00f0ff;
            color: black;
            border: none;
            padding: 10px 20px;
            margin: 10px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Courier New';
        }

        .btn:hover {
            background: #fff;
        }

        .p-bar {
            width: 200px;
            height: 6px;
            background: #222;
            margin: 5px auto;
            border: 1px solid #445;
        }

        #p-fill {
            width: 0%;
            height: 100%;
            background: #0f0;
            transition: width 0.1s;
        }

        .hidden {
            display: none !important;
        }

        #records-list {
            font-size: 14px;
            color: #aaa;
            text-align: left;
            margin: 10px 0;
        }

        select {
            background: #111;
            color: white;
            border: 1px solid #00f0ff;
            padding: 5px;
        }
    </style>
</head>

<body>

    <div id="main-menu">
        <h1>SPACE DEFENDER</h1>
        <p>RECORDS:</p>
        <div id="records-list"></div>

        <div style="margin: 15px 0;">
            <label>COLOR DE LA NAU: </label>
            <select id="shipColor">
                <option value="#00f0ff">Cian</option>
                <option value="#ff00ff">Magenta</option>
                <option value="#00ff00">Llima</option>
                <option value="#ffff00">Groc</option>
                <option value="#ffffff">Blanc</option>
            </select>
        </div>

        <button class="btn" onclick="startGame()">INICIAR MISSIÓ</button>
    </div>

    <div id="hud" class="hidden">
        <div id="status">Sistemes Online...</div>
        <div id="p-label" style="color: yellow; font-size: 14px; margin-top: 4px;"></div>
        <div class="p-bar">
            <div id="p-fill"></div>
        </div>
    </div>

    <canvas id="canvas" width="800" height="450"></canvas>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        let ship, bullets, enemyBullets, enemies, boss, stars, planets, asteroids, items;
        let score = 0, lives = 3, difficulty = 1;
        let bossesKilled = 0, lastBossSpawnScore = 0, lastShot = 0, lastBossShot = 0;
        let keys = {};
        let gameActive = false;
        let shipColor = "#00f0ff";

        const POWERS = {
            DOUBLE: { name: "DOBLE CANYÓ", char: "D", color: "#00f0ff" },
            SHOTGUN: { name: "SISTEMA ESCOPETA", char: "S", color: "#ffaa00" },
            BOUNCE: { name: "NÚCLEO REBOT", char: "R", color: "#00ff00" },
            HEAVY: { name: "MUNICIIÓ PESADA", char: "P", color: "#ff00ff" }
        };

        let activePower = null, powerTimer = 0;

        // Inicialització d'estrelles i planetes per al fons (sempre actiu)
        stars = Array.from({ length: 100 }, () => ({ x: Math.random() * 800, y: Math.random() * 450, s: 0.5 + Math.random() }));
        planets = Array.from({ length: 3 }, (_, i) => ({ x: 100 + (i * 300), y: Math.random() * 450, r: 15 + Math.random() * 30, s: 0.05, c: `hsla(${Math.random() * 360}, 40%, 30%, 0.3)` }));

        function startGame() {
            shipColor = document.getElementById("shipColor").value;
            document.getElementById("main-menu").classList.add("hidden");
            document.getElementById("hud").classList.remove("hidden");
            reset();
            gameActive = true;
        }

        function reset() {
            ship = { x: 100, y: 225, speed: 5.5 };
            bullets = []; enemyBullets = []; enemies = []; asteroids = []; items = [];
            boss = null; score = 0; lives = 3; difficulty = 1; bossesKilled = 0; lastBossSpawnScore = 0;
            activePower = null; powerTimer = 0;
        }

        function updateRecords() {
            const records = JSON.parse(localStorage.getItem("space_records") || "[]");
            const list = document.getElementById("records-list");
            list.innerHTML = records.length ? "" : "No hi ha dades.";
            records.sort((a, b) => b - a).slice(0, 5).forEach((r, i) => {
                list.innerHTML += `<div>${i + 1}. ${r} punts</div>`;
            });
        }

        function saveScore(s) {
            let records = JSON.parse(localStorage.getItem("space_records") || "[]");
            records.push(s);
            records.sort((a, b) => b - a);
            localStorage.setItem("space_records", JSON.stringify(records.slice(0, 5)));
        }

        window.addEventListener("keydown", e => keys[e.key] = true);
        window.addEventListener("keyup", e => keys[e.key] = false);

        function drawShip(x, y) {
            ctx.save(); ctx.translate(x, y);
            ctx.fillStyle = shipColor; ctx.fillRect(-25, -5, 10, 10);
            ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.moveTo(15, 0); ctx.lineTo(-15, -12); ctx.lineTo(-15, 12); ctx.fill();
            ctx.restore();
        }

        function drawEnemy(x, y, sz) {
            ctx.fillStyle = "#ff2244"; ctx.fillRect(x, y, 4, sz); ctx.fillRect(x + sz - 4, y, 4, sz); ctx.fillRect(x, y + sz / 2 - 2, sz, 4);
            ctx.beginPath(); ctx.arc(x + sz / 2, y + sz / 2, 4, 0, Math.PI * 2); ctx.fill();
        }

        function fire() {
            let now = Date.now();
            let delay = activePower === 'HEAVY' ? 400 : 150;
            if (now - lastShot < delay) return;
            lastShot = now;
            if (activePower === 'DOUBLE') {
                bullets.push({ x: ship.x, y: ship.y - 10, vx: 11, vy: 0, dmg: 1 }, { x: ship.x, y: ship.y + 10, vx: 11, vy: 0, dmg: 1 });
            } else if (activePower === 'SHOTGUN') {
                for (let i = -2; i <= 2; i++) bullets.push({ x: ship.x + 10, y: ship.y, vx: 9, vy: i * 2.5, life: 25, dmg: 1 });
            } else if (activePower === 'BOUNCE') {
                bullets.push({ x: ship.x + 10, y: ship.y, vx: 7, vy: 5, bnc: 4, dmg: 1.5, col: '#0f0' });
            } else if (activePower === 'HEAVY') {
                bullets.push({ x: ship.x + 10, y: ship.y, vx: 5, vy: 0, dmg: 8, sz: 12, col: '#ff00ff' });
            } else {
                bullets.push({ x: ship.x + 10, y: ship.y, vx: 12, vy: 0, dmg: 1 });
            }
        }

        function loop() {
            ctx.clearRect(0, 0, 800, 450);

            // Fons (sempre corre)
            planets.forEach(p => { p.x -= p.s; if (p.x + 50 < 0) p.x = 850; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fillStyle = p.c; ctx.fill(); });
            ctx.fillStyle = "white"; stars.forEach(s => { s.x -= s.s; if (s.x < 0) s.x = 800; ctx.fillRect(s.x, s.y, 1, 1); });

            if (!gameActive) {
                requestAnimationFrame(loop);
                return;
            }

            // Lògica del joc activa
            if (activePower) {
                powerTimer -= 16.6;
                document.getElementById("p-fill").style.width = (powerTimer / 10000 * 100) + "%";
                document.getElementById("p-label").innerText = POWERS[activePower].name;
                if (powerTimer <= 0) { activePower = null; document.getElementById("p-label").innerText = ""; }
            }

            if (keys["ArrowUp"]) ship.y -= ship.speed; if (keys["ArrowDown"]) ship.y += ship.speed;
            if (keys["ArrowLeft"]) ship.x -= ship.speed; if (keys["ArrowRight"]) ship.x += ship.speed;
            ship.x = Math.max(20, Math.min(780, ship.x)); ship.y = Math.max(20, Math.min(430, ship.y));
            drawShip(ship.x, ship.y);
            if (keys[" "]) fire();

            // Balas, Asteroides, Enemics (Codi original adaptat)
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i]; b.x += b.vx; b.y += b.vy;
                if (b.bnc && (b.y < 0 || b.y > 450)) b.vy *= -1;
                ctx.fillStyle = b.col || shipColor;
                ctx.fillRect(b.x, b.y, b.sz || 8, b.sz / 3 || 2);
                if (b.x > 850 || b.x < -100 || (b.life && --b.life < 0)) { bullets.splice(i, 1); continue; }
                asteroids.forEach((a, ai) => {
                    if (Math.hypot(b.x - a.x, b.y - a.y) < a.r) {
                        a.hp -= b.dmg; if (!b.bnc) b.x = 2000;
                        if (a.hp <= 0) {
                            let type = Object.keys(POWERS)[Math.floor(Math.random() * 4)];
                            items.push({ x: a.x, y: a.y, type: type });
                            asteroids.splice(ai, 1);
                        }
                    }
                });
            }

            if (Math.random() < 0.003) asteroids.push({ x: 850, y: Math.random() * 400, r: 20, hp: 3 });
            for (let i = asteroids.length - 1; i >= 0; i--) {
                let a = asteroids[i]; a.x -= 2;
                ctx.strokeStyle = "#888"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(a.x, a.y, a.r, 0, Math.PI * 2); ctx.stroke();
                if (a.x < -50) asteroids.splice(i, 1);
            }

            for (let i = items.length - 1; i >= 0; i--) {
                let it = items[i]; it.x -= 1.5;
                ctx.fillStyle = POWERS[it.type].color; ctx.fillText("[" + it.type[0] + "]", it.x, it.y);
                if (Math.hypot(ship.x - it.x, ship.y - it.y) < 25) { activePower = it.type; powerTimer = 10000; items.splice(i, 1); }
                else if (it.x < -20) items.splice(i, 1);
            }

            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                let eb = enemyBullets[i]; eb.x -= (5 + difficulty * 0.6);
                ctx.fillStyle = "#ffcc00"; ctx.fillRect(eb.x, eb.y, 8, 4);
                if (Math.hypot(ship.x - eb.x, ship.y - eb.y) < 15) { lives--; enemyBullets.splice(i, 1); if (lives <= 0) return gameOver(); }
                else if (eb.x < -10) enemyBullets.splice(i, 1);
            }

            if (!boss && Math.random() < 0.018 + (difficulty * 0.006)) {
                enemies.push({ x: 800, y: Math.random() * 400, sz: 25, spd: 1.6 + (difficulty * 0.45), canShoot: Math.random() < (0.2 + difficulty * 0.05), lastShot: Date.now() - Math.random() * 1000, hp: 1 });
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i]; e.x -= e.spd; drawEnemy(e.x, e.y, e.sz);
                if (e.canShoot && e.x > 150 && Date.now() - e.lastShot > 1200) { enemyBullets.push({ x: e.x, y: e.y + e.sz / 2 }); e.lastShot = Date.now(); }
                bullets.forEach(b => { if (b.x > e.x && b.x < e.x + e.sz && b.y > e.y && b.y < e.y + e.sz) { e.hp = 0; if (!b.bnc) b.x = 2000; } });
                if (e.hp <= 0) { score++; enemies.splice(i, 1); }
                else if (e.x < -30) enemies.splice(i, 1);
                else if (Math.hypot(ship.x - (e.x + 12), ship.y - (e.y + 12)) < 25) { lives--; enemies.splice(i, 1); if (lives <= 0) return gameOver(); }
            }

            if (!boss && score >= lastBossSpawnScore + 25) {
                lastBossSpawnScore = score;
                boss = { x: 800, y: 150, sz: 110, life: 45 + bossesKilled * 25, max: 45 + bossesKilled * 25, hit: 0, dir: 1, shotDelay: Math.max(600, 1300 - (bossesKilled * 100)) };
            }

            if (boss) {
                if (boss.x > 600) boss.x -= 1;
                boss.y += boss.dir * (1.6 + difficulty * 0.25);
                if (boss.y <= 10 || boss.y >= 330) boss.dir *= -1;
                ctx.fillStyle = boss.hit > 0 ? "white" : "#aa00ff"; if (boss.hit > 0) boss.hit--;
                ctx.fillRect(boss.x + 20, boss.y + 10, boss.sz - 40, boss.sz - 20); ctx.fillRect(boss.x, boss.y, 15, boss.sz); ctx.fillRect(boss.x + boss.sz - 15, boss.y, 15, boss.sz);
                if (Date.now() - lastBossShot > boss.shotDelay) { enemyBullets.push({ x: boss.x, y: boss.y + 20 }, { x: boss.x, y: boss.y + 55 }, { x: boss.x, y: boss.y + 90 }); lastBossShot = Date.now(); }
                ctx.fillStyle = "red"; ctx.fillRect(200, 10, (boss.life / boss.max) * 400, 8);
                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    if (b.x > boss.x && b.x < boss.x + boss.sz && b.y > boss.y && b.y < boss.y + boss.sz) {
                        boss.life -= b.dmg; boss.hit = 2; if (!b.bnc) bullets.splice(j, 1);
                        if (boss.life <= 0) { boss = null; score += 5; bossesKilled++; difficulty += 0.5; break; }
                    }
                }
            }

            document.getElementById("status").innerText = `PUNTUACIÓ: ${score} | ❤️: ${lives} | SECTOR: ${Math.floor(difficulty)}`;
            requestAnimationFrame(loop);
        }

        function gameOver() {
            gameActive = false;
            saveScore(score);
            alert("FI DE LA MISSIÓ\nSectors: " + bossesKilled + "\nPunts: " + score);
            document.getElementById("main-menu").classList.remove("hidden");
            document.getElementById("hud").classList.add("hidden");
            updateRecords();
        }

        updateRecords();
        loop();
    </script>
</body>

</html>
